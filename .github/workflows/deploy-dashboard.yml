name: Deploy dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'dealer-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dealer-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dealer-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b07b5ba293af78f8f3e95c39ae4e5033
          workingDirectory: dealer-dashboard
          command: pages deploy .svelte-kit/cloudflare --project-name securepay-dashboard

      - name: Sync Paystack secret to Pages
        working-directory: dealer-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b07b5ba293af78f8f3e95c39ae4e5033
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: echo "$PAYSTACK_SECRET_KEY" | npx wrangler pages secret put PAYSTACK_SECRET_KEY --project-name securepay-dashboard